<div class="login-container">
  <div class="left-login">
    <img src="https://i.imgur.com/AMpcXII.png" alt="Logo" class="logo-img" />
    <h1>POLÍCIA DIM</h1>
    <p>Acesse sua conta para entrar no fórum</p>
  </div>
  <div class="right-login">
    <h2>Bem-vindo!</h2>
    <form>
      <div class="input-group">
        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário" required />
      </div>
      <div class="input-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required />
      </div>
      <button class="btn-login" type="submit">Entrar</button>
      <div class="extra-links">
        <p><a href="#">Esqueci minha senha</a></p>
        <p><a href="#">Criar nova conta</a></p>
      </div>
    </form>
  </div>
</div>

<div class="personagem" id="personagemLynsk">
  <img src="https://i.imgur.com/IewsAAX.png" alt="Líder Habbo" class="personagem-img">
  <div class="balao-fala" id="falaBalao"></div>
</div>

<div id="notif"></div>
<div id="loading"><div class="spinner"></div></div>
